[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expert_deferral"
version = "0.1.0"
description = "Which uncertainty should decide when to ask the expert? Deferral under distribution shift (BloodMNIST)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Maryam Tavasoli" }]
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "pandas>=2.1", "tqdm>=4.66", "torch>=2.2", "scikit-learn>=1.4", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B007", "B023", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
